version: '3.7'

services:
  answer_appraiser:
    image: answer-appraiser
    container_name: answer_appraiser
    build:
      context: .
    ports:
      - '${PORT:-9096}:9096'
    # The LMDB stores (clinical evidence + publications) are read from ./data,
    # built offline and pointed at by the LMDB_PATH / PUBLICATIONS_LMDB_PATH
    # settings.
    volumes:
      - ./data:/app/data
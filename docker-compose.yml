version: '3.7'

services:
  answer_appraiser:
    image: answer-appraiser
    container_name: answer_appraiser
    build:
      context: .
    ports:
      - '${PORT:-9096}:9096'
    # The clinical evidence LMDB store is read from ./data (built offline via
    # app/clinical_evidence/merge.py and pointed at by the LMDB_PATH setting).
    volumes:
      - ./data:/app/data
  # Redis is still used by the novelty scorer for publication lookups.
  redis:
    image: redis/redis-stack-server:latest
    container_name: answer_appraiser_redis
    build:
      context: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./data:/data